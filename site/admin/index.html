<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Webbridge CRM</title>
<style>
:root{--bg:#edeff2;--card:#fff;--ink:#10141b;--mut:#6b7280;--line:#e3e6ea;--acc:#ff6b2c;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--chip:#f3f4f6}
@media (prefers-color-scheme:dark){:root{--bg:#0d1016;--card:#161b23;--ink:#e8eaee;--mut:#9aa3af;--line:#262d38;--chip:#1f2630}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,Segoe UI,Arial,sans-serif}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;padding:10px 18px}
.logo{font-weight:800;font-size:17px;letter-spacing:-.02em;text-decoration:none}.logo i{color:var(--acc);font-style:normal}
nav a{text-decoration:none;padding:6px 10px;border-radius:8px;color:var(--mut)}nav a.on{background:var(--chip);color:var(--ink);font-weight:600}
.grow{flex:1}.cfg{display:flex;gap:6px;flex-wrap:wrap}.dot{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--chip);color:var(--mut)}.dot.on{color:var(--ok)}.dot.off{color:var(--warn)}
main{max-width:1240px;margin:0 auto;padding:18px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:1.4fr 1fr}@media(max-width:860px){.g2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
h2{font-size:15px;margin:0 0 10px}h1{font-size:20px;margin:0 0 4px}
.kpi b{display:block;font-size:24px;letter-spacing:-.02em}.kpi small{color:var(--mut)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--mut);font-weight:600}
tr.click{cursor:pointer}tr.click:hover td{background:var(--chip)}
.stage{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--chip);white-space:nowrap}
.s-lead{color:#2563eb}.s-brief_sent,.s-brief_ok{color:#7c3aed}.s-sketch_paid,.s-deposit_paid{color:var(--ok)}.s-sketches,.s-building,.s-review{color:var(--warn)}.s-live,.s-care{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}.s-lost{color:var(--mut)}
.mut{color:var(--mut)}.sm{font-size:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}textarea{min-height:90px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:600;white-space:nowrap}.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn:disabled{opacity:.5;cursor:default}
.tl{list-style:none;margin:0;padding:0}.tl li{display:grid;grid-template-columns:84px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.tl time{color:var(--mut);font-size:12px}.tl b{font-weight:600}.tl p{margin:3px 0 0;white-space:pre-wrap;color:var(--mut)}
.k-payment b{color:var(--ok)}.k-lead b{color:#2563eb}.k-note b{color:#7c3aed}.k-email_out b{color:var(--ink)}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.toolbar input{max-width:320px}.toolbar select{max-width:220px}
.dl{display:grid;grid-template-columns:130px 1fr;gap:6px 10px}.dl dt{color:var(--mut)}.dl dd{margin:0;overflow-wrap:anywhere}
.proj{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;display:none;z-index:9}
.empty{padding:28px;text-align:center;color:var(--mut)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);max-width:560px;width:calc(100% - 32px)}dialog::backdrop{background:#0006}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips label{display:flex;gap:5px;align-items:center;background:var(--chip);border-radius:8px;padding:4px 8px;font-size:12px}.chips input{width:auto}
.late{color:var(--warn);font-weight:700;font-size:12px}.lrow td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
</style>
</head>
<body>
<header>
  <a class="logo" href="#">Webbridge<i>.</i> <span class="mut sm" style="font-weight:500">CRM</span></a>
  <nav><a href="#" data-nav="home">Áttekintés</a><a href="#ugyfelek" data-nav="list">Ügyfelek</a></nav>
  <span class="grow"></span>
  <div class="cfg" id="cfg"></div>
  <button class="btn" id="add">+ Új ügyfél</button>
</header>
<main id="app"><div class="empty">Betöltés…</div></main>
<div class="toast" id="toast"></div>

<dialog id="dlg"><form method="dialog" id="dlgf" class="grid" style="gap:10px"></form></dialog>

<script>
const STAGES={lead:"Új érdeklődő",brief_sent:"Brief elküldve",brief_ok:"Brief jóváhagyva",sketch_paid:"Vázlatdíj fizetve",sketches:"Vázlatok kint",deposit_paid:"Előleg fizetve",building:"Készül",review:"Ügyfél nézi",live:"Élesítve",care:"Üzemeltetés",lost:"Elveszett"};
const ITEMS={landing:"Egyoldalas weboldal",site:"Céges weboldal",shop:"Webshop",logo:"Logó",brand:"Brandbook",strategy:"Marketingstratégia",plan:"90 napos terv",setup:"Pro technikai csomag",move:"Költöztetés",lang:"+1 nyelv",newpage:"Új aloldal",care:"Gondtalan üzemeltetés",mkt1:"Marketing Min.",mkt2:"Marketing Köz.",mkt3:"Marketing Max.",shopcare:"Webshop-üzemeltetés",email:"Céges e-mail",chat:"Weboldal-asszisztens",phone:"Virtuális recepciós",extra:"Extra csatorna"};
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dt=s=>s?new Date(s).toLocaleString("hu-HU",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}):"";
const ago=s=>{if(!s)return"";const m=Math.round((Date.now()-new Date(s))/6e4);return m<1?"most":m<60?m+" perce":m<1440?Math.round(m/60)+" órája":Math.round(m/1440)+" napja"};
const money=(v,c)=>c==="EUR"?"€"+Number(v||0).toLocaleString("en-GB"):Number(v||0).toLocaleString("hu-HU")+" Ft";
const stage=s=>`<span class="stage s-${s}">${esc(STAGES[s]||s||"–")}</span>`;
const sla=x=>!x?"":x.stuck?`<span class="late" title="Határ: ${x.limit} óra">⏰ ${x.hours} órája</span>`:`<span class="mut sm">${x.hours} órája</span>`;
const attrTxt=a=>{try{a=typeof a==="string"?JSON.parse(a||"{}"):a||{}}catch{a={}}return [a.source,a.utm_campaign,a.ref?("ajánló: "+a.ref):"",a.referrer&&!/^(https?:\/\/)?(www\.)?webbridge/.test(a.referrer)?a.referrer:"",a.landing].filter(Boolean).join(" · ")};
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2600)}
async function api(path,body){const r=await fetch("/api/admin/"+path,body?{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)}:{});const j=await r.json().catch(()=>({error:"Hiba ("+r.status+")"}));if(!r.ok||j.ok===false)throw new Error(j.error||("Hiba "+r.status));return j}

async function route(){
  const h=location.hash.slice(1);document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",(a.dataset.nav==="list"&&h.startsWith("ugyfelek"))||(a.dataset.nav==="home"&&!h)));
  try{if(h.startsWith("w/"))await workPage(h.slice(2));else if(h.startsWith("c/"))await detail(h.slice(2));else if(h.startsWith("ugyfelek"))await list(new URLSearchParams(h.split("?")[1]||""));else await home()}
  catch(e){app.innerHTML=`<div class="card empty">${esc(e.message)}</div>`}
}
window.addEventListener("hashchange",route);

async function home(){
  const [d,ex,ins,vl]=await Promise.all([api("overview"),api("escalations").catch(()=>({items:[]})),api("instructions").catch(()=>({items:[]})),api("vat-limit").catch(()=>null)]);
  const vatBox=vl&&vl.ok?`<div class="card" style="margin-bottom:14px${vl.pct>=75?";border:2px solid var(--warn)":""}"><h2>Észt ÁFA-határ ${vl.year} <span class="mut sm">– adószám nélküli cégek + magánszemélyek, idei befizetések</span></h2><p style="margin:6px 0"><b>${vl.eur_equiv.toLocaleString("hu-HU")} €</b> / ${vl.limit.toLocaleString("hu-HU")} € (${vl.pct}%) <span class="mut sm">· ${vl.huf.toLocaleString("hu-HU")} Ft + ${vl.eur.toLocaleString("hu-HU")} €, ${vl.rate} Ft/€ tájékoztató árfolyam</span></p><div style="height:8px;background:var(--line);border-radius:4px;overflow:hidden"><i style="display:block;height:100%;width:${Math.min(100,vl.pct)}%;background:${vl.pct>=75?"var(--warn)":"var(--ok)"}"></i></div></div>`:"";
  const IS={unconfirmed:"Visszaigazolásra vár",queued:"Sorban",in_progress:"Folyamatban",needs_ok:"Jóváhagyásodra vár",approved:"Jóváhagyva, sorban",failed:"Nem sikerült"};
  const insBox=ins.items.length?`<div class="card" id="utasitasok" style="margin-bottom:14px"><h2>Utasítások e-mailben <span class="mut sm">– utasitas@reply.webbridge.hu (${ins.items.length})</span></h2><table>${ins.items.map(x=>`<tr><td style="width:170px"><b>${esc(IS[x.status]||x.status)}</b><div class="mut sm">${ago(x.at)} · ${esc(x.id)}</div></td><td><b>${esc(x.subject||"(nincs tárgy)")}</b><div style="white-space:pre-wrap" class="sm">${esc((x.body||"").slice(0,400))}</div>${x.proposal?`<div class="sm mut">Javaslat: ${esc(x.proposal.slice(0,300))}</div>`:""}${x.result?`<div class="sm mut">Eredmény: ${esc(x.result.slice(0,300))}</div>`:""}</td><td style="width:90px;text-align:right"><button class="btn" data-ins="${x.id}">Lezár</button></td></tr>`).join("")}</table></div>`:"";
  const RS={price:"Árat alkudna / egyedi ajánlat",complaint:"Panasz",urgent:"Sürgős",human:"Emberrel beszélne",unknown:"Nem tudott válaszolni",other:"Egyéb"};
  const escBox=ex.items.length?`<div class="card esc-box" id="rad-var" style="margin-bottom:14px;border:2px solid var(--warn)"><h2>Rád vár <span class="mut sm">– amit a virtuális asszisztens nem tudott elintézni (${ex.items.length})</span></h2><table>${ex.items.map(x=>`<tr><td style="width:150px"><b style="${x.urgency==="urgent"?"color:var(--bad)":""}">${x.urgency==="urgent"?"SÜRGŐS · ":""}${RS[x.reason]||x.reason}</b><div class="mut sm">${x.source==="phone"?"Telefon":"Chat"} · ${ago(x.at)}</div></td><td><b>${esc(x.caller_name||"Ismeretlen")}</b> ${x.phone?`<a href="tel:${esc(x.phone)}">${esc(x.phone)}</a>`:""} ${x.email?`<a href="mailto:${esc(x.email)}">${esc(x.email)}</a>`:""}<div style="white-space:pre-wrap;margin-top:4px">${esc(x.summary)}</div>${x.callback?`<div class="mut sm">Válasz: ${esc(x.callback)}</div>`:""}${x.customer_id?`<div class="sm"><a href="#c/${x.customer_id}">Ügyfél megnyitása →</a></div>`:""}</td><td style="width:90px;text-align:right"><button class="btn" data-esc="${x.id}">Kész</button></td></tr>`).join("")}</table></div>`:"";
  $("#cfg").innerHTML=[["brevo","E-mail"],["stripe","Stripe"],["stripe_webhook","Webhook"],["cron","Időzítő"],["review","Értékelés-link"],["anthropic","AI"]].map(([k,l])=>`<span class="dot ${d.config[k]?"on":"off"}" title="${d.config[k]?"Beállítva":"Hiányzik a kulcs"}">● ${l}</span>`).join("");
  const by=Object.fromEntries(d.stages.map(s=>[s.stage,s.n]));
  const open=Object.entries(by).filter(([k])=>!["live","care","lost"].includes(k)).reduce((a,[,n])=>a+n,0);
  const rev=d.revenue30.map(r=>money(r.total,r.currency)).join(" + ")||"0 Ft";
  const late=d.todo.filter(p=>p.sla&&p.sla.stuck).length;
  app.innerHTML=escBox+insBox+vatBox+`<div class="grid g4" style="margin-bottom:14px">
    <div class="card kpi"><small>Nyitott projektek</small><b>${open}</b></div>
    <div class="card kpi"><small>Elakadt</small><b style="${late?"color:var(--warn)":""}">${late}</b></div>
    <div class="card kpi"><small>Készül / ügyfél nézi</small><b>${(by.building||0)+(by.review||0)+(by.sketches||0)}</b></div>
    <div class="card kpi"><small>Bevétel (30 nap)</small><b>${rev}</b></div></div>
  <div class="grid g2"><div class="card"><h2>Teendők</h2>${d.todo.length?`<table><tr><th>Projekt</th><th>Státusz</th><th>Következő lépés</th></tr>${d.todo.map(p=>`<tr class="click${p.sla&&p.sla.stuck?" lrow":""}" data-c="${p.customer_id}"><td><b>${esc(p.title||p.email)}</b><div class="mut sm">${p.id}</div></td><td>${stage(p.stage)}<div>${sla(p.sla)}</div></td><td>${esc(p.next_action||"–")}<div class="mut sm">${p.next_action_at?dt(p.next_action_at):""}</div></td></tr>`).join("")}</table>`:`<div class="empty">Nincs nyitott teendő.</div>`}</div>
  <div class="card"><h2>Legutóbb történt</h2><ul class="tl">${d.events.map(e=>`<li class="k-${e.kind}"><time>${ago(e.at)}</time><div><b>${esc(e.title)}</b><div class="sm mut">${e.customer_id?`<a href="#c/${e.customer_id}">${esc(e.business||e.name||e.email||e.customer_id)}</a>`:""}</div></div></li>`).join("")||`<div class="empty">Még nincs esemény.</div>`}</ul></div></div>
  <div class="card" style="margin-top:14px"><h2>Honnan jönnek? <span class="mut sm">(utolsó 90 nap)</span></h2>${d.sources&&d.sources.length?`<table><tr><th>Forrás</th><th>Érdeklődő</th><th>Megnyert</th><th>Konverzió</th><th>Befizetve</th></tr>${d.sources.map(s=>`<tr><td><b>${esc(s.source)}</b></td><td>${s.leads}</td><td>${s.won}</td><td>${s.leads?Math.round(s.won/s.leads*100):0}%</td><td>${[s.paid_huf?money(s.paid_huf,"HUF"):"",s.paid_eur?money(s.paid_eur,"EUR"):""].filter(Boolean).join(" + ")||"–"}</td></tr>`).join("")}</table>`:`<div class="empty">Még nincs adat. Az új rendeléseknél a weboldal automatikusan rögzíti a forrást (Google, Meta, ajánlás, UTM-kampány).</div>`}</div>`;
  app.querySelectorAll("tr[data-c]").forEach(r=>r.onclick=()=>location.hash="c/"+r.dataset.c);
  app.querySelectorAll("[data-esc]").forEach(b=>b.onclick=async()=>{b.disabled=true;await api("escalations",{id:b.dataset.esc,status:"done"});home()});
  app.querySelectorAll("[data-ins]").forEach(b=>b.onclick=async()=>{b.disabled=true;await api("instructions",{id:b.dataset.ins,status:"done",result:"Kézzel lezárva a CRM-ben."});home()});
  if(location.hash==="#utasitasok"){const el=$("#utasitasok");if(el)el.scrollIntoView()}
  if(location.hash==="#rad-var"){const el=$("#rad-var");if(el)el.scrollIntoView()}
}

async function list(qs){
  const q=qs.get("q")||"",st=qs.get("stage")||"";
  const d=await api(`customers?q=${encodeURIComponent(q)}&stage=${st}`);
  app.innerHTML=`<div class="toolbar"><input id="q" placeholder="Keresés: név, cég, e-mail, telefon, rendelésszám" value="${esc(q)}"><select id="st"><option value="">Minden státusz</option>${Object.entries(STAGES).map(([k,v])=>`<option value="${k}" ${k===st?"selected":""}>${v}</option>`).join("")}</select><span class="mut" style="align-self:center">${d.customers.length} ügyfél</span></div>
  <div class="card" style="padding:4px 10px">${d.customers.length?`<table><tr><th>Ügyfél</th><th>Státusz</th><th>Forrás</th><th>Érték</th><th>Fizetve</th><th>Következő lépés</th><th>Frissült</th></tr>${d.customers.map(c=>`<tr class="click" data-c="${c.id}"><td><b>${esc(c.business||c.name||c.email||c.phone)}</b><div class="mut sm">${esc([c.name,c.email,c.phone].filter(Boolean).join(" · "))}</div></td><td>${stage(c.stage||"lead")}<div>${["live","care","lost"].includes(c.stage)?"":sla(c.sla)}</div></td><td class="sm">${esc(c.lead_source||c.source||"")}</td><td>${c.amount?money(c.amount,c.currency):"–"}</td><td>${c.paid?money(c.paid,c.currency):"–"}</td><td class="sm">${esc(c.next_action||"")}</td><td class="mut sm">${ago(c.updated_at)}</td></tr>`).join("")}</table>`:`<div class="empty">Nincs találat.</div>`}</div>`;
  const go=()=>location.hash=`ugyfelek?q=${encodeURIComponent($("#q").value)}&stage=${$("#st").value}`;
  $("#q").onkeydown=e=>{if(e.key==="Enter")go()};$("#st").onchange=go;
  app.querySelectorAll("tr[data-c]").forEach(r=>r.onclick=()=>location.hash="c/"+r.dataset.c);
}

async function detail(id){
  const d=await api("customers/"+id),c=d.customer;
  app.innerHTML=`<div class="row" style="margin-bottom:12px"><a href="#ugyfelek" class="mut">← Ügyfelek</a></div>
  <div class="grid g2">
   <div class="grid" style="align-content:start">
    <div class="card"><div class="row" style="justify-content:space-between"><div><h1>${esc(c.business||c.name||c.email||c.phone)}</h1><div class="mut">${esc([c.name,c.email,c.phone].filter(Boolean).join(" · "))}</div></div><button class="btn" id="edit">Szerkesztés</button></div>
     <dl class="dl" style="margin-top:12px"><dt>Forrás</dt><dd>${esc(c.source||"")}${attrTxt(c.attribution)?`<div class="sm mut">${esc(attrTxt(c.attribution))}</div>`:""}</dd><dt>Nyelv</dt><dd>${c.lang==="en"?"Angol":"Magyar"}</dd><dt>Vevő</dt><dd>${c.buyer_type==="b2c"?"Magánszemély":"Cég"} ${esc(c.company||"")}</dd><dt>Adószám</dt><dd>${esc(c.vat_id||"–")}</dd><dt>Számlázási cím</dt><dd>${esc(c.billing_addr||"–")}</dd><dt>Ügyfél óta</dt><dd>${dt(c.created_at)}</dd><dt>Címkék</dt><dd>${esc(c.tags||"–")}</dd></dl></div>
    ${d.projects.map(p=>proj(p)).join("")||`<div class="card empty">Nincs projekt.</div>`}
    <div class="card" id="pultcard"><h2>Pult</h2><div class="mut sm">Betöltés…</div></div>
    <div class="card"><h2>Jegyzet</h2><textarea id="note" placeholder="Pl. telefonon egyeztettünk: a logó maradjon, csak frissítsük."></textarea><div class="row" style="margin-top:8px"><button class="btn pri" id="addnote">Mentés az idővonalra</button></div></div>
   </div>
   <div class="grid" style="align-content:start">
    <div class="card"><h2>Fizetések</h2>${d.payments.length?`<table>${d.payments.map(p=>`<tr><td>${dt(p.at)}</td><td>${esc(p.kind)}</td><td><b>${money(p.amount,p.currency)}</b></td><td class="sm ${p.status==="paid"?"":"mut"}">${p.status==="paid"?"fizetve":esc(p.status)}</td></tr>`).join("")}</table>`:`<div class="mut">Még nincs fizetés.</div>`}</div>
    <div class="card"><h2>Idővonal</h2><ul class="tl">${d.events.map(e=>`<li class="k-${e.kind}"><time title="${esc(e.at)}">${dt(e.at)}</time><div><b>${esc(e.title)}</b>${e.body?`<p>${esc(e.body)}</p>`:""}${e.kind==="email_out"&&e.meta&&JSON.parse(e.meta).status!=="sent"?`<div class="sm" style="color:var(--warn)">nem ment ki: ${esc(JSON.parse(e.meta).error||JSON.parse(e.meta).status)}</div>`:""}</div></li>`).join("")}</ul></div>
   </div></div>`;
  $("#edit").onclick=()=>editCustomer(c);
  pultCard(id,d.projects).catch(e=>{$("#pultcard").innerHTML=`<h2>Pult</h2><div class="mut sm">${esc(e.message)}</div>`});
  $("#addnote").onclick=async()=>{const v=$("#note").value.trim();if(!v)return;await api("customers/"+id,{note:v});toast("Mentve");route()};
  app.querySelectorAll("[data-stage]").forEach(s=>s.onchange=async()=>{await api("projects/"+s.dataset.stage,{stage:s.value});toast("Státusz frissítve");route()});
  app.querySelectorAll("[data-next]").forEach(b=>b.onclick=async()=>{const pid=b.dataset.next;await api("projects/"+pid,{next_action:$("#na-"+pid).value,next_action_at:$("#nat-"+pid).value?new Date($("#nat-"+pid).value).toISOString():""});toast("Mentve");route()});

const DECN={ok:"✅ Mehet",change:"✏️ Változtatás",skip:"⏭ Kihagyjuk"};
/** Posztnaptár a CRM-ben: posztonként a döntés és a hozzá tartozó megjegyzések. */
async function postsBlock(v,d,thread){
  const h=app.querySelector(`[data-posts="${v.id}"]`);if(!h)return;
  const jf=v.files.find(f=>f.type==="application/json"||/\.json$/i.test(f.name));if(!jf){h.textContent="Ebben a verzióban nincs JSON-fájl.";return}
  const r=await fetch(afile(jf.key));const raw=await r.json();const arr=Array.isArray(raw)?raw:(raw&&raw.posts)||[];
  const dec=new Map(d.decisions.filter(x=>x.version_id===v.id).map(x=>[x.post_id,x]));
  const cms=d.comments.filter(c=>c.version_id===v.id&&!c.parent_id&&c.post_id);
  const cnt={ok:0,change:0,skip:0};dec.forEach(x=>{if(cnt[x.decision]!=null)cnt[x.decision]++});
  h.className="";h.innerHTML=`<div class="sm" style="margin:6px 0"><b>${arr.length} poszt</b> · ${cnt.ok} mehet · ${cnt.change} változtatás · ${cnt.skip} kihagyva · ${Math.max(0,arr.length-dec.size)} még vár</div>
   <table><tr><th>Dátum</th><th>Csatorna</th><th>Szöveg</th><th>Döntés</th></tr>${arr.map(p=>{const id=String(p&&p.id||""),x=dec.get(id),pc=cms.filter(c=>c.post_id===id);
    return `<tr><td class="sm" style="white-space:nowrap">${esc(p.date||"")}</td><td class="sm">${esc(p.channel||"")}</td><td class="sm"><div style="white-space:pre-wrap;max-height:7.5em;overflow:auto">${esc(String(p.text||"").slice(0,600))}</div>${pc.map(thread).join("")}</td><td class="sm" style="white-space:nowrap">${x?`${DECN[x.decision]||esc(x.decision)}<div class="mut">${esc(x.by_name||"")} · ${dt(x.at)}</div>`:`<span class="mut">még nincs</span>`}</td></tr>`}).join("")}</table>`;
  const id=d.work.id;
  h.querySelectorAll("[data-cs]").forEach(s=>s.onchange=async()=>{await api("works/"+id,{action:"comment_status",comment_id:s.dataset.cs,status:s.value});toast("Mentve")});
  h.querySelectorAll("[data-rs]").forEach(b=>b.onclick=async()=>{const i=h.querySelector(`[data-rp="${b.dataset.rs}"]`);if(!i.value.trim())return;await api("works/"+id,{action:"reply",parent_id:b.dataset.rs,body:i.value.trim()});toast("Elküldve");route()});
}
