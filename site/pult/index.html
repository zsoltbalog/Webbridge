<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Webbridge Pult</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600..900&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDEFF2;--surface:#FFFFFF;--sunk:#E3E6EB;--ink:#10141B;--muted:#58616F;--line:#D2D7DE;
  --hazard:#FF6B2C;--on-hazard:#10141B;--cobalt:#2B47F5;--on-cobalt:#FFFFFF;--ok:#1E8A55;--warn:#B45309;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;--body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1015;--surface:#151A22;--sunk:#10141A;--ink:#ECEFF4;--muted:#8E97A6;--line:#262D38;--cobalt:#7187FF;--on-cobalt:#0D1015;--ok:#4CC488;--warn:#F59E0B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1015;--surface:#151A22;--sunk:#10141A;--ink:#ECEFF4;--muted:#8E97A6;--line:#262D38;--cobalt:#7187FF;--on-cobalt:#0D1015;--ok:#4CC488;--warn:#F59E0B;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--cobalt)}button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-stretch:112%;margin:0;line-height:1.05}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
.brand{font-family:var(--display);font-weight:900;font-stretch:118%;font-size:19px;text-decoration:none;color:var(--ink)}.brand i{color:var(--hazard);font-style:normal}
.brand small{font-family:var(--body);font-weight:500;font-stretch:100%;color:var(--muted);font-size:13px;margin-left:6px}
.sp{flex:1}.mut{color:var(--muted)}.sm{font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--muted)}.btn.pri{background:var(--hazard);border-color:var(--hazard);color:var(--on-hazard)}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.pin:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
input[type=email],input[type=text],input[type=url],textarea,select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px}
textarea{min-height:84px;resize:vertical}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.tag.review{background:color-mix(in srgb,var(--cobalt) 14%,transparent);color:var(--cobalt)}.tag.changes{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}.tag.approved{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
/* login */
.login{min-height:calc(100vh - 60px);display:grid;place-items:center;padding:24px 0}
.login .card{max-width:420px;width:100%;padding:28px 24px}.login h1{font-size:30px;margin-bottom:8px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:16px 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{width:100%;background:var(--surface)}
/* list */
.page{padding:22px 0 60px}.page>h1{font-size:34px;margin:6px 0 4px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:18px}
.wcard{display:block;text-decoration:none;color:inherit;padding:0;overflow:hidden}.wcard:hover{border-color:var(--muted)}
.wcard .th{aspect-ratio:16/10;background:var(--sunk);display:grid;place-items:center;overflow:hidden}.wcard .th img{width:100%;height:100%;object-fit:contain;background:#fff}
.wcard .bd{padding:14px 16px;display:grid;gap:6px}.wcard h3{font-size:18px}
.empty{text-align:center;padding:40px 16px}
.aic{margin-top:28px}
/* work view */
.wv{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start;margin-top:14px}
@media (max-width:900px){.wv{grid-template-columns:1fr}}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage{background:var(--sunk);border-radius:12px;padding:12px;display:grid;gap:12px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:700px){.cmp{grid-template-columns:1fr}}
.canvas{position:relative;background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.12);cursor:crosshair;user-select:none;touch-action:manipulation}
.canvas.ro{cursor:default}.canvas img,.canvas canvas{display:block;width:100%;height:auto;border-radius:6px}
.canvas .pg{position:absolute;left:8px;top:8px;font-size:12px;background:rgba(16,20,27,.7);color:#fff;border-radius:4px;padding:1px 6px}
.pin{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--hazard);color:var(--on-hazard);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);display:grid;place-items:center;font-weight:800;font-size:12px;cursor:pointer;padding:0}
.pin span{transform:rotate(45deg)}.pin.done,.pin.verified{background:var(--ok);color:#fff}.pin.new{background:var(--cobalt);color:#fff}.pin.hl{outline:3px solid var(--cobalt)}
.side{position:sticky;top:72px;display:grid;gap:12px;max-height:calc(100vh - 88px);overflow:auto}
@media (max-width:900px){.side{position:static;max-height:none}}
.cm{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);display:grid;gap:6px}.cm.hl{border-color:var(--cobalt)}
.cm .hd{display:flex;gap:8px;align-items:center;font-size:13px}.cm .n{width:22px;height:22px;border-radius:50%;background:var(--hazard);color:var(--on-hazard);display:grid;place-items:center;font-weight:800;font-size:11px;flex:none}
.cm .n.g{background:var(--sunk);color:var(--muted)}.cm .body{white-space:pre-wrap;font-size:14px}
.rep{margin-left:12px;padding-left:10px;border-left:2px solid var(--line);font-size:13px}.rep.staff b{color:var(--hazard)}
.st{font-size:12px;font-weight:600}.st.open{color:var(--warn)}.st.doing{color:var(--cobalt)}.st.done,.st.verified{color:var(--ok)}
.pop{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:14px;width:min(340px,calc(100vw - 24px));display:grid;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.seg button{flex:1;border:0;background:transparent;padding:7px 6px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.foot{display:grid;gap:8px}.note{font-size:13px;background:var(--sunk);border-radius:8px;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100vw - 32px)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);width:min(460px,calc(100vw - 24px));padding:20px}dialog::backdrop{background:rgba(0,0,0,.45)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.help{font-size:13px;color:var(--muted)}
/* weboldal-előnézet */
.wtool{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.wtool .seg{flex:none}.wtool .seg button{padding:7px 14px}
.wpath{display:flex;align-items:center;gap:6px;flex:1 1 220px;min-width:0;margin:0}.wpath label{white-space:nowrap}.wpath input{padding:7px 10px;min-width:0;flex:1}
#cmode[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:var(--on-cobalt)}
.devwrap{display:flex;justify-content:center;min-width:0}
.dev{position:relative;overflow:hidden;background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.12);flex:none}
.dev .frame{position:absolute;left:0;top:0;transform-origin:0 0}.dev iframe{border:0;width:100%;height:100%;display:block;background:#fff}
.ovl{position:absolute;inset:0;cursor:crosshair;background:color-mix(in srgb,var(--cobalt) 7%,transparent);box-shadow:inset 0 0 0 4px var(--cobalt)}
/* dokumentum */
.doc{background:var(--surface);color:var(--ink);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.12);padding:28px 34px;max-width:820px;width:100%;margin:0 auto;overflow-wrap:anywhere;font-size:16px;line-height:1.6}
.doc h1,.doc h2,.doc h3,.doc h4{margin:1.2em 0 .45em}.doc h1{font-size:30px}.doc h2{font-size:23px}.doc h3{font-size:19px}.doc h4,.doc h5,.doc h6{font-size:16px}
.doc>:first-child{margin-top:0}.doc p,.doc ul,.doc ol,.doc blockquote,.doc pre,.doc .tw{margin:0 0 .9em}.doc ul,.doc ol{padding-left:1.4em}.doc li{margin:.2em 0}.doc li.ind{margin-left:1.4em}
.doc blockquote{border-left:3px solid var(--line);padding:2px 12px;color:var(--muted)}.doc hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}
.doc code{background:var(--sunk);border-radius:4px;padding:1px 4px;font-size:.92em}.doc pre{background:var(--sunk);border-radius:6px;padding:10px 12px;overflow-x:auto;white-space:pre-wrap}
.doc .tw{overflow-x:auto}.doc table{border-collapse:collapse;min-width:100%;font-size:14px}.doc th,.doc td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}.doc th{background:var(--sunk)}
mark.qm{background:color-mix(in srgb,var(--hazard) 32%,transparent);color:inherit;border-radius:2px;cursor:pointer}mark.qm.done,mark.qm.verified{background:color-mix(in srgb,var(--ok) 26%,transparent)}mark.qm.hl{outline:2px solid var(--cobalt)}
.selbtn{position:fixed;z-index:45;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.quote{font-size:13px;border-left:3px solid var(--hazard);padding:1px 8px;color:var(--muted);font-style:italic;white-space:pre-wrap;overflow-wrap:anywhere}
/* posztnaptár */
.psum{display:flex;flex-wrap:wrap;gap:6px}.psum .tag{font-size:13px}
.week{display:grid;gap:8px}.week>h3{font-size:16px;font-stretch:100%}
.posts{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));align-items:start}
.post{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;align-content:start;min-width:0}
.post.d-ok{box-shadow:inset 0 3px 0 var(--ok)}.post.d-change{box-shadow:inset 0 3px 0 var(--warn)}.post.d-skip .pimg,.post.d-skip .ptext{opacity:.45}.post.hl{outline:2px solid var(--cobalt)}
.post .phd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.post .pimg{width:100%;aspect-ratio:1/1;max-height:260px;object-fit:cover;border-radius:6px;background:var(--sunk);display:block}
.ch{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff}.ch-facebook{background:#1877F2}.ch-instagram{background:#C13584}.ch-linkedin{background:#0A66C2}.ch-google{background:#1E8A55}.ch-other{background:#58616F}
.ptext{white-space:pre-wrap;font-size:14px;overflow-wrap:anywhere}
.pbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.pbtns .btn{padding:7px 4px;font-size:13px;min-width:0}
.pbtns .btn[aria-pressed="true"][data-dec="ok"]{background:var(--ok);border-color:var(--ok);color:#fff}.pbtns .btn[aria-pressed="true"][data-dec="change"]{background:var(--warn);border-color:var(--warn);color:#fff}.pbtns .btn[aria-pressed="true"][data-dec="skip"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dec{font-size:12px;font-weight:700}.dec.ok{color:var(--ok)}.dec.change{color:var(--warn)}.dec.skip{color:var(--muted)}
.prop{font-size:13px;background:color-mix(in srgb,var(--warn) 12%,transparent);border-radius:6px;padding:6px 8px;white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:640px){.doc{padding:18px 16px}.stage{padding:8px}.wpath label{display:none}}
@media (max-width:640px){#who{display:none!important}.brand small{display:none}header.top .btn{padding:7px 10px}}
</style>
</head>

/* ---------- 2. lépés: weboldal-előnézet (kind "web") ----------
   Az előnézet más originről jön (Cloudflare Pages preview), ezért a tartalmát nem látjuk:
   se a görgetési helyzetet, se az elemet, se az aktuális útvonalat. A megjegyzés mód egy átlátszó

let DEV=window.innerWidth<700?"mobile":"desktop",CMODE=false,WPATH="/";
const DEVS={mobile:[390,780],desktop:[1280,800]};
function normPath(s){s=String(s||"").trim();if(/^https?:\/\//i.test(s)){try{const u=new URL(s);s=u.pathname+u.search}catch(e){s="/"}}if(!s.startsWith("/"))s="/"+s;return s.replace(/[\u0000-\u001f\u007f]/g,"").slice(0,300)}
function previewSrc(base,path){try{const b=new URL(base);const u=new URL(path&&path!=="/"?path:b.pathname+b.search,b);return u.origin===b.origin?u.href:b.href}catch(e){return base}}
function fitWeb(){const box=$("#devbox");if(!box)return;const [w,h]=DEVS[DEV];const avail=box.parentElement.clientWidth||w;const s=Math.min(1,avail/w);
  box.style.width=Math.floor(w*s)+"px";box.style.height=Math.floor(h*s)+"px";const fr=box.firstElementChild;fr.style.width=w+"px";fr.style.height=h+"px";fr.style.transform=`scale(${s})`}
window.addEventListener("resize",()=>{clearTimeout(fitWeb.h);fitWeb.h=setTimeout(fitWeb,120)});

    <div class="devwrap"><div class="dev" id="devbox"><div class="frame"><iframe id="wfr" title="${esc(t("livePreview"))}" src="${esc(src)}" sandbox="${sb}" referrerpolicy="no-referrer"></iframe><div class="ovl" id="ovl" ${CMODE&&canComment?"":"hidden"}></div></div></div></div></div>`;
  fitWeb();

  const cm=$("#cmode");if(cm)cm.onclick=()=>{CMODE=!CMODE;cm.setAttribute("aria-pressed",CMODE);$("#ovl").hidden=!CMODE;$("#chelp").textContent=(CMODE?t("cmodeOn"):t("cmodeOff"))+" "+t("webNote");if(!CMODE)closePop()};

/* ---------- 3a. lépés: Markdown-dokumentum, szövegkijelöléses megjegyzés ----------
   Biztonságos, szűk Markdown: címsorok, bekezdések, listák, félkövér/dőlt, kód, idézet, vonal, táblázat, linkek.
   Minden szöveg escape-elve; nyers HTML nincs (a < > jelek szövegként jelennek meg). */
const mdCache=new Map();
function safeUrl(u){u=String(u||"").trim();return /^(https?:|mailto:)/i.test(u)||u.startsWith("#")?u:null}
function mdInline(src){
  const toks=[],put=h=>"\u0000"+(toks.push(h)-1)+"\u0000";
  let s=String(src).replace(/\u0000/g,"");
  s=s.replace(/`([^`]+)`/g,(_,c)=>put("<code>"+esc(c)+"</code>"));
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g,(_,txt,url)=>{const u=safeUrl(url);return u?put(`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">`)+txt+put("</a>"):txt});
  s=esc(s);
  s=s.replace(/\*\*(?=\S)(.+?)\*\*|__(?=\S)(.+?)__/g,(_,a,b)=>"<strong>"+(a||b)+"</strong>");
  s=s.replace(/\*(?=[^\s*])([^*]+?)\*/g,"<em>$1</em>").replace(/(^|[^\w])_(?=\S)([^_]+?)_(?=[^\w]|$)/g,"$1<em>$2</em>");
  return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>toks[+i]);
}
function mdToHtml(md){
  const L=String(md).replace(/\r\n?/g,"\n").split("\n"),out=[];let i=0;
  const cells=l=>l.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(x=>x.trim());
  const isSep=l=>/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const blockStart=l=>/^\s*(#{1,6}\s|>|```|[-*+]\s|\d+[.)]\s)/.test(l)||/^\s*([-*_])(\s*\1){2,}\s*$/.test(l);
  while(i<L.length){const l=L[i];
    if(!l.trim()){i++;continue}
    let m;
    if(/^\s*```/.test(l)){const buf=[];i++;while(i<L.length&&!/^\s*```/.test(L[i]))buf.push(L[i++]);i++;out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);continue}
    if(m=l.match(/^\s*(#{1,6})\s+(.*?)\s*#*\s*$/)){const n=m[1].length;out.push(`<h${n}>${mdInline(m[2])}</h${n}>`);i++;continue}
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){out.push("<hr>");i++;continue}
    if(/^\s*>/.test(l)){const buf=[];while(i<L.length&&/^\s*>/.test(L[i]))buf.push(L[i++].replace(/^\s*>\s?/,""));out.push(`<blockquote>${buf.filter(x=>x.trim()).map(x=>`<p>${mdInline(x)}</p>`).join("")}</blockquote>`);continue}
    if(l.includes("|")&&i+1<L.length&&isSep(L[i+1])){const hd=cells(l);i+=2;const rows=[];while(i<L.length&&L[i].includes("|")&&L[i].trim())rows.push(cells(L[i++]));
      out.push(`<div class="tw"><table><thead><tr>${hd.map(c=>`<th>${mdInline(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${hd.map((_,k)=>`<td>${mdInline(r[k]||"")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);continue}
    if(m=l.match(/^(\s*)([-*+]|\d+[.)])\s+/)){const ord=/\d/.test(m[2]);const items=[];
      while(i<L.length){const mm=L[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if(mm&&(/\d/.test(mm[2])===ord||mm[1].length>=2)){items.push({ind:mm[1].length>=2,txt:mm[3]});i++}
        else if(L[i].trim()&&/^\s{2,}\S/.test(L[i])&&items.length&&!blockStart(L[i])){items[items.length-1].txt+=" "+L[i].trim();i++}
        else break}
      const tg=ord?"ol":"ul";out.push(`<${tg}>${items.map(x=>`<li${x.ind?' class="ind"':""}>${mdInline(x.txt)}</li>`).join("")}</${tg}>`);continue}
    const buf=[];while(i<L.length&&L[i].trim()&&!blockStart(L[i])&&!(L[i].includes("|")&&i+1<L.length&&isSep(L[i+1])))buf.push(L[i++].trim());
    if(!buf.length){buf.push(L[i++].trim())}
    out.push(`<p>${buf.map(mdInline).join(" ")}</p>`)}
  // minden felső szintű blokk sorszámot kap: erre hivatkozik a megjegyzés helye ("blokk:eltolás")
  return out.map((h,k)=>h.replace(/^<(\w+)/,`<$1 data-b="${k}"`)).join("");
}
async function renderDoc(host,f,v,canComment){
  let md=mdCache.get(f.key);
  if(md==null){host.innerHTML=`<p class="sm mut">…</p>`;try{const r=await fetch(fileUrl(f.key),{credentials:"same-origin"});if(!r.ok)throw 0;md=await r.text();mdCache.set(f.key,md)}catch(e){host.innerHTML=`<p class="note">${t("docErr")}</p>`;return}}
  host.innerHTML=`<article class="doc" id="doc" data-key="${esc(f.key)}" ${canComment?'data-edit="1"':""}>${mdToHtml(md)}</article>`;
  const doc=host.querySelector("#doc");
  W.comments.filter(c=>c.version_id===v.id&&!c.parent_id&&c.quote&&c.file_key===f.key).forEach(c=>markQuote(doc,c));
  doc.addEventListener("click",e=>{const m=e.target.closest("mark.qm");if(m&&!(getSelection()+"").trim())focusComment(m.dataset.mk)});
}
/** A megjegyzés idézetének kiemelése a blokkjában (legjobb szándékkal: a mentett eltoláshoz legközelebbi előfordulás). */
function markQuote(doc,c){
  const [bi,off]=String(c.anchor||"").split(":").map(Number);
  const blocks=Number.isFinite(bi)?[doc.querySelector(`[data-b="${bi}"]`)].filter(Boolean):[];
  if(!blocks.length)blocks.push(...doc.querySelectorAll("[data-b]"));
  const q=String(c.quote||"").trim(),cands=[q,q.split("\n")[0].trim()].filter(x=>x.length>=2);
  for(const blk of blocks){const txt=blk.textContent;
    for(const cand of cands){let best=-1,pos=txt.indexOf(cand);
      while(pos>=0){if(best<0||Math.abs(pos-(off||0))<Math.abs(best-(off||0)))best=pos;pos=txt.indexOf(cand,pos+1)}
      if(best>=0){wrapText(blk,best,best+cand.length,c);return}}}
}
function wrapText(root,start,end,c){
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let pos=0,n;const segs=[];
  while((n=tw.nextNode())){const len=n.data.length,a=Math.max(start,pos),b=Math.min(end,pos+len);if(a<b)segs.push([n,a-pos,b-pos]);pos+=len;if(pos>=end)break}
  segs.forEach(([node,a,b])=>{let mid=node;if(a>0)mid=node.splitText(a);if(b-a<mid.data.length)mid.splitText(b-a);
    const mk=document.createElement("mark");mk.className="qm "+c.status;mk.dataset.mk=c.id;mk.title=c.body.slice(0,120);mid.parentNode.insertBefore(mk,mid);mk.appendChild(mid)});
}
let SELBTN=null,SELCTX=null;
function hideSel(){if(SELBTN){SELBTN.remove();SELBTN=null}}
function selOpen(e){if(e){e.preventDefault();e.stopPropagation()}const c=SELCTX,r=SELBTN?SELBTN.getBoundingClientRect():{left:innerWidth/2,top:100,bottom:100,right:innerWidth/2};hideSel();if(c)openPop({doc:true,...c},r)}
function updateSelBtn(){

  const raw=s.toString().trim();if(raw.length<2){hideSel();return}
  const sn=r.startContainer.nodeType===1?r.startContainer:r.startContainer.parentElement;const blk=sn&&sn.closest("[data-b]");if(!blk||!doc.contains(blk)){hideSel();return}
  const pre=document.createRange();pre.setStart(blk,0);pre.setEnd(r.startContainer,r.startOffset);

  if(!SELBTN){SELBTN=document.createElement("button");SELBTN.type="button";SELBTN.className="btn pri sm selbtn";SELBTN.textContent="💬 "+t("selCmt");
    // pointerdown: még a kijelölés megszűnése előtt (érintőképernyőn is)
    SELBTN.addEventListener("pointerdown",selOpen);SELBTN.addEventListener("click",e=>{if(SELCTX)selOpen(e)});document.body.appendChild(SELBTN)}
  const rc=r.getBoundingClientRect(),bw=SELBTN.offsetWidth,bh=SELBTN.offsetHeight;
  let top=rc.bottom+10;if(top+bh>innerHeight-8)top=Math.max(8,rc.top-bh-10);
  SELBTN.style.top=top+"px";SELBTN.style.left=Math.min(innerWidth-bw-8,Math.max(8,rc.left+rc.width/2-bw/2))+"px";
}

/* ---------- 3b. lépés: posztnaptár (kind "posts") ----------
   A verzió egy JSON-fájl: [{id,date:"YYYY-MM-DD",channel,text,image_key?|image?,notes?}]; a kép a verzió
   egy fájljára hivatkozik (R2-kulcs vagy fájlnév). Döntés posztonként: ok | change | skip. */
const POSTS=new Map(),CHN={facebook:"Facebook",instagram:"Instagram",linkedin:"LinkedIn",google:"Google",other:"–"};
async function loadPosts(v){
  if(POSTS.has(v.id))return POSTS.get(v.id);
  const jf=v.files.find(f=>f.type==="application/json"||/\.json$/i.test(f.name||""));let ps=null;
  if(jf){try{const r=await fetch(fileUrl(jf.key),{credentials:"same-origin"});if(r.ok){const raw=await r.json();const arr=Array.isArray(raw)?raw:raw&&Array.isArray(raw.posts)?raw.posts:[];
    const seen=new Set();ps=[];for(const o of arr.slice(0,200)){if(!o||typeof o!=="object")continue;const id=String(o.id??"").trim();if(!/^[\w.:-]{1,64}$/.test(id)||seen.has(id))continue;seen.add(id);
      const img=String(o.image_key??o.image??"").trim();const fl=img?(v.files.find(x=>x.key===img)||v.files.find(x=>x.name===img)):null;const ch=String(o.channel??"").toLowerCase();
      ps.push({id,date:/^\d{4}-\d{2}-\d{2}$/.test(String(o.date??""))?String(o.date):"",channel:CHN[ch]&&ch!=="other"?ch:"other",text:String(o.text??"").slice(0,5000),image_key:fl?fl.key:null,notes:String(o.notes??"").slice(0,1000)})}}}catch(e){ps=null}}
  if(ps)ps.forEach((p,k)=>p._k=k),ps.sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999")||a._k-b._k);
  POSTS.set(v.id,ps);return ps;
}
function postLabel(v,id){const p=(POSTS.get(v.id)||[]).find(x=>x.id===id);if(!p)return t("post")+" "+id;return [p.date?fmtDay(p.date):"",CHN[p.channel]||""].filter(Boolean).join(" · ")}
const loc=()=>lang==="hu"?"hu-HU":"en-GB";
const fmtDay=ds=>new Date(ds+"T12:00:00").toLocaleDateString(loc(),{weekday:"short",month:"short",day:"numeric"});
function weekKey(ds){if(!ds)return "";const d=new Date(ds+"T12:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toISOString().slice(0,10)}
function weekLabel(k){if(!k)return t("noDate");const a=new Date(k+"T12:00:00"),b=new Date(a);b.setDate(b.getDate()+6);const f=d=>d.toLocaleDateString(loc(),{month:"short",day:"numeric"});return `${f(a)} – ${f(b)}`}
function renderPosts(host,v,canEdit){
  const ps=POSTS.get(v.id);if(!ps||!ps.length){host.innerHTML=`<p class="note">${t("postsErr")}</p>`;return}
  const {c,ds}=postStats(v),roots=rootComments(v);
  const weeks=new Map();ps.forEach(p=>{const k=weekKey(p.date);if(!weeks.has(k))weeks.set(k,[]);weeks.get(k).push(p)});
  host.innerHTML=`<div style="display:grid;gap:14px"><div class="psum" aria-live="polite"><span class="tag approved">✓ ${c.ok} ${t("n_ok")}</span><span class="tag changes">✎ ${c.change} ${t("n_change")}</span><span class="tag">✕ ${c.skip} ${t("n_skip")}</span>${c.pending?`<span class="tag review">${c.pending} ${t("n_pending")}</span>`:""}</div>
  ${[...weeks].map(([k,list])=>`<section class="week"><h3>${esc(weekLabel(k))}</h3><div class="posts">${list.map(p=>{
    const d=ds.get(p.id)||"",pc=roots.filter(x=>x.post_id===p.id),prop=[...pc].reverse().find(x=>x.proposal);
    return `<article class="post ${d?"d-"+d:""}" data-post="${esc(p.id)}"><div class="phd"><b>${p.date?esc(fmtDay(p.date)):esc(t("noDate"))}</b><span class="ch ch-${p.channel}">${esc(CHN[p.channel])}</span><span class="sp"></span>${d?`<span class="dec ${d}">${esc(t("p_"+d))}</span>`:""}</div>
     ${p.image_key?`<img class="pimg" src="${fileUrl(p.image_key)}" alt="" loading="lazy">`:""}
     <div class="ptext" data-pt="${esc(p.id)}">${esc(p.text)}</div>
     ${prop?`<div class="prop"><b>${t("proposed")}:</b>\n${esc(prop.body)}</div>`:""}
     ${p.notes?`<div class="sm mut">${t("ourNote")}: ${esc(p.notes)}</div>`:""}
     ${canEdit?`<div class="pbtns" role="group">${["ok","change","skip"].map(x=>`<button type="button" class="btn" data-dec="${x}" data-p="${esc(p.id)}" aria-pressed="${d===x}">${x==="ok"?"✓ ":x==="change"?"✎ ":"✕ "}${t("p_"+x)}</button>`).join("")}</div>
       <div class="row" style="justify-content:space-between"><button type="button" class="btn sm ghost" data-edit="${esc(p.id)}">✍ ${t("editText")}</button>${pc.length?`<button type="button" class="btn sm ghost" data-pc="${esc(p.id)}">💬 ${pc.length}</button>`:""}</div>`
      :pc.length?`<button type="button" class="btn sm ghost" data-pc="${esc(p.id)}">💬 ${pc.length} ${t("cmtN")}</button>`:""}
    </article>`}).join("")}</div></section>`).join("")}</div>`;
  const byId=id=>ps.find(p=>p.id===id);
  host.querySelectorAll("[data-dec]").forEach(b=>b.onclick=async e=>{const pid=b.dataset.p,dec=b.dataset.dec;
    if(dec==="change"){openPop({post_id:pid},b.getBoundingClientRect());return}
    b.disabled=true;try{await api("works/"+W.work.id,{action:"post",version_id:v.id,post_id:pid,decision:b.getAttribute("aria-pressed")==="true"?"clear":dec});await workView(W.work.id,true)}catch(err){toast(err.message);b.disabled=false}});
  host.querySelectorAll("[data-pc]").forEach(b=>b.onclick=()=>{const first=roots.find(x=>x.post_id===b.dataset.pc);if(first)focusComment(first.id)});
  host.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const p=byId(b.dataset.edit),box=host.querySelector(`[data-pt="${CSS.escape(p.id)}"]`);if(!box||box.querySelector("textarea"))return;
    const pc=roots.filter(x=>x.post_id===p.id&&x.proposal),cur=pc.length?pc[pc.length-1].body:p.text;
    box.innerHTML=`<textarea aria-label="${t("editText")}" style="min-height:140px">${esc(cur)}</textarea><div class="row" style="justify-content:flex-end;margin-top:6px"><button type="button" class="btn sm ghost" data-x>${t("cancel")}</button><button type="button" class="btn sm pri" data-s>${t("save")}</button></div>`;
    const ta=box.querySelector("textarea");ta.focus();
    box.querySelector("[data-x]").onclick=()=>{box.textContent=p.text};
    box.querySelector("[data-s]").onclick=async ev=>{const body=ta.value.trim();if(!body||body===p.text.trim()){box.textContent=p.text;return}ev.target.disabled=true;
      try{await api("comments",{work_id:W.work.id,version_id:v.id,post_id:p.id,action:"change",proposal:true,body});await workView(W.work.id,true)}catch(err){toast(err.message);ev.target.disabled=false}}});
}

/* ---------- megjegyzés-ablak ---------- */
let POP=null;
function closePop(){if(POP){POP.el.remove();if(POP.tmp)POP.tmp.remove();POP=null}}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePop()});
function openPop(ctx,rect){
  closePop();const v=curV();
  const el=document.createElement("div");el.className="pop";el.setAttribute("role","dialog");
  el.innerHTML=`<div class="seg" role="group">${["change","add","remove"].map((a,i)=>`<button type="button" data-a="${a}" aria-pressed="${i===0}">${t("a_"+a)}</button>`).join("")}</div>
   <textarea id="pbody" placeholder="${t("ph")}" aria-label="${t("ph")}"></textarea>
   <input type="url" id="plink" placeholder="${t("link")}">
   <div class="row" style="justify-content:space-between"><button type="button" class="btn sm" id="patt" ${CFG.upload?"":"hidden"}>📎 ${t("attach")}</button><span class="sm mut" id="pattn"></span></div>
   <div class="row" style="justify-content:flex-end"><button type="button" class="btn sm ghost" id="pcan">${t("cancel")}</button><button type="button" class="btn sm pri" id="psave">${t("save")}</button></div>`;
  document.body.appendChild(el);
  let tmp=null;if(ctx.box){tmp=document.createElement("div");tmp.className="pin new";tmp.style.left=(ctx.x*100)+"%";tmp.style.top=(ctx.y*100)+"%";tmp.innerHTML="<span>+</span>";ctx.box.appendChild(tmp)}
  POP={el,tmp,ctx,action:"change",att:null};
  const w=el.offsetWidth,h=el.offsetHeight;let left=Math.min(window.innerWidth-w-12,Math.max(12,rect.left-w/2)),top=rect.bottom+14;if(top+h>window.innerHeight-12)top=Math.max(12,rect.top-h-14);
  el.style.left=left+"px";el.style.top=top+"px";$("#pbody").focus();
  el.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{POP.action=b.dataset.a;el.querySelectorAll("[data-a]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  $("#pcan").onclick=closePop;
  $("#patt").onclick=()=>{const fi=$("#attfile");fi.value="";fi.onchange=async()=>{const f=fi.files[0];if(!f)return;$("#pattn").textContent=t("uploading");
    try{const r=await fetch("/api/pult/attach",{method:"POST",headers:{"x-filename":encodeURIComponent(f.name),"content-type":f.type||"application/octet-stream"},body:f});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||t("err"));POP.att=j.attachment;$("#pattn").textContent="📎 "+f.name}catch(e){$("#pattn").textContent="";toast(e.message)}};fi.click()};
  $("#psave").onclick=async()=>{const body=$("#pbody").value.trim();if(!body){$("#pbody").focus();return}const b=$("#psave");b.disabled=true;
    const link=$("#plink").value.trim();const att=POP.att||(link?{url:/^https?:\/\//i.test(link)?link:"https://"+link}:null);
    const pl={work_id:W.work.id,version_id:v.id,file_key:ctx.general?null:ctx.file_key,page:ctx.page||null,x:ctx.general?null:ctx.x,y:ctx.general?null:ctx.y,action:POP.action,body,attachment:att};
    if(!ctx.general){if(ctx.web){pl.device=ctx.device;pl.path=ctx.path}if(ctx.doc){pl.quote=ctx.quote;pl.anchor=ctx.anchor}if(ctx.post_id)pl.post_id=ctx.post_id}
    try{await api("comments",pl);
      closePop();if(ctx.web)await refreshSide();else await workView(W.work.id,true)}catch(e){toast(e.message);b.disabled=false}};
}

/* ---------- csapat ---------- */
async function teamDlg(){
  const m=await api("me");if(m.__login)return loginView();ME=m;
  const f=$("#dlgf");f.innerHTML=`<h2 style="font-size:22px">${t("teamT")}</h2><p class="help">${t("teamP")}</p>
   <div style="display:grid;gap:6px;margin:10px 0">${m.team.filter(u=>!u.disabled).map(u=>`<div class="row" style="justify-content:space-between"><span class="sm"><b>${esc(u.name||u.email)}</b> ${u.name?`<span class="mut">${esc(u.email)}</span>`:""} <span class="tag">${t(u.role)}</span> <span class="mut">${u.last_login?t("lastLogin")+": "+dt(u.last_login):t("never")}</span></span>${u.role==="reviewer"?`<button type="button" class="btn sm ghost" data-rm="${u.id}">${t("remove")}</button>`:""}</div>`).join("")}</div>
   <div style="display:grid;gap:8px"><input type="email" id="ie" placeholder="${t("email")}" autocomplete="off"><input type="text" id="in" placeholder="${t("name")}"></div>
   <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn ghost" value="cancel">${t("done")}</button><button type="button" class="btn pri" id="isend">${t("invite")}</button></div>`;
  const d=$("#dlg");d.showModal();
  f.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{try{await api("team",{action:"remove",user_id:b.dataset.rm});d.close();teamDlg()}catch(e){toast(e.message)}});
  $("#isend").onclick=async()=>{const b=$("#isend");b.disabled=true;try{await api("team",{action:"invite",email:$("#ie").value,name:$("#in").value});toast(t("invited"));d.close();teamDlg()}catch(e){toast(e.message);b.disabled=false}};
}
