# Cloudflare Pages: statikus oldal (site/) + Pages Functions (functions/) + D1 CRM
name = "webbridge"
pages_build_output_dir = "site"
compatibility_date = "2026-10-01"

[vars]
SITE_URL = "https://webbridge-1zo.pages.dev"
MAIL_FROM = "hello@webbridge.hu"
MAIL_FROM_NAME = "Webbridge"
NOTIFY_TO = "hello@webbridge.hu"
# Bejövő válaszlevelek (Brevo inbound, MX: reply.webbridge.hu → inbound1/2.sendinblue.com): pult+<munka>@REPLY_DOMAIN
REPLY_DOMAIN = "reply.webbridge.hu"
# Pult Google-belépés: OAuth-kliens a TES "webbridge-tes" Google Cloud projektjében (nyilvános azonosító; a titok: GOOGLE_CLIENT_SECRET)
GOOGLE_CLIENT_ID = "207155811762-00k17ir827op41veah28o179jlvn3lbb.apps.googleusercontent.com"
# REVIEW_URL = "https://g.page/r/…/review"   # Google-értékelés link: ha megvan a Cégprofil, ide kerül

[[d1_databases]]
binding = "DB"
database_name = "webbridge-crm"
database_id = "5f8fbcc0-ba37-40de-a7c3-ce935d577582"

# Titkok (Cloudflare dashboard → Pages → webbridge → Settings → Variables and Secrets, típus: Secret):
#   ADMIN_PASSWORD, BREVO_API_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, ANTHROPIC_API_KEY, CRON_SECRET, GOOGLE_CLIENT_SECRET

# Ügyfél-feltöltések és Pult-fájlok (R2, EU-joghatóság).
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "webbridge-uploads-eu"
jurisdiction = "eu"
